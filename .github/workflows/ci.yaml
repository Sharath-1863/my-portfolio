name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: sharath2003/my-portfolio:${{ github.run_number }}

    - name: Update image tag in deployment.yaml
      run: |
        sed -i "s|sharath2003/my-portfolio:.*|sharath2003/my-portfolio:${{ github.run_number }}|g" k8s/deployment.yaml

    - name: Commit and push updated manifest
      run: |
        git config user.email "sharathraghav2003@gmail.com"
        git config user.name "Sharath-1863"
        git add k8s/deployment.yaml
        git commit -m "Update image tag [skip ci]" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Sharath-1863/my-portfolio.git
